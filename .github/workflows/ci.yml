name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Isolate the pinned Node executable
        run: bash scripts/prepare-github-node.sh
      - name: Prepare reviewed build-only tools
        run: |
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
          bin="$(node scripts/build-tools.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - name: Verify selected build tools
        run: node scripts/build-tools.mjs --check
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependency graph
        run: npm run audit:security
      - name: Verify source and both build modes
        run: npm run check
